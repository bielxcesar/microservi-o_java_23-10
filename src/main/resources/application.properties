# Configuração da conexão com o MongoDB (Usa variável de ambiente ou banco local por padrão)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/thindesk}
spring.data.mongodb.auto-index-creation=true

# Autenticação do Spring Security (Usa variável de ambiente ou credenciais padrão)
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:thindesk}

# Configurações do Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false